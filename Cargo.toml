[package]
name = "agent-tools-core"
version = "0.1.0"
edition = "2021"
description = "Shared plumbing for the agent CLI tools: repo-root detection, output format, JSON envelope, exit codes"
license = "Apache-2.0"

[lib]
name = "agent_tools_core"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
